<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Tu código de R-Info</title>
</head>
<body style="margin:0;padding:0;background:#F4F4F6;-webkit-text-size-adjust:100%;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;">Tu código para entrar a R-Info es {{ .Token }}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#F4F4F6;">
  <tr>
    <td align="center" style="padding:32px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:440px;">
        <!-- Marca -->
        <tr>
          <td align="center" style="padding-bottom:20px;">
            <img src="https://raw.githubusercontent.com/Eduardo-Vilela/rinfo-mobile/main/apps/mobile/assets/icon.png" width="56" height="56" alt="R-Info" style="display:block;border:0;border-radius:14px;">
          </td>
        </tr>
        <!-- Tarjeta -->
        <tr>
          <td style="background:#FFFFFF;border-radius:20px;padding:32px 28px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#18181B;">
            <p style="margin:0 0 8px;font-size:13px;font-weight:700;letter-spacing:0.6px;text-transform:uppercase;color:#4F46E5;">R-Info · Ingreso UNLP</p>
            <h1 style="margin:0 0 12px;font-size:24px;line-height:30px;font-weight:800;color:#18181B;">Tu código para entrar</h1>
            <p style="margin:0 0 24px;font-size:15px;line-height:22px;color:#52525B;">Escribilo en la app para seguir practicando.</p>
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td align="center" style="background:#EEF0FF;border:1px solid #DCDFFB;border-radius:14px;padding:20px 12px;">
                  <span style="font-family:'SFMono-Regular',Menlo,Consolas,'Courier New',monospace;font-size:34px;line-height:40px;font-weight:700;letter-spacing:10px;color:#3730A3;">{{ .Token }}</span>
                </td>
              </tr>
            </table>
            <p style="margin:20px 0 0;font-size:13px;line-height:20px;color:#71717A;">El código vence en 1 hora y sirve una sola vez. No se lo pases a nadie.</p>
          </td>
        </tr>
        <!-- Pie -->
        <tr>
          <td align="center" style="padding:20px 12px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;line-height:18px;color:#A1A1AA;">
            Si no pediste este código, ignorá este mail: nadie puede entrar sin él.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
