name: APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    # Google: el Client ID web se carga en GitHub → Settings → Secrets and variables → Actions.
    env:
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Tests del intérprete
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm --filter mobile lint

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Generar proyecto Android
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - name: Huella SHA-1 de la firma (para el cliente OAuth Android de Google)
        working-directory: apps/mobile/android/app
        run: |
          sha=$(keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android | grep 'SHA1:' | awk '{print $2}')
          echo "SHA-1: $sha"
          echo "### Firma del APK" >> "$GITHUB_STEP_SUMMARY"
          echo "Paquete \`com.eduardovilela.rinfo\` · SHA-1 \`$sha\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Compilar APK
        working-directory: apps/mobile/android
        # Solo arm64-v8a (todos los celulares actuales): compila 4 veces menos código nativo.
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g"
        timeout-minutes: 30

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: rinfo-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk

      - name: Publicar en el release "ultima"
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk rinfo.apk
          gh release delete ultima --yes --cleanup-tag || true
          gh release create ultima rinfo.apk \
            --title "Última versión" \
            --notes "APK generado desde ${GITHUB_SHA::7}. Descargalo desde el celular e instalalo." \
            --prerelease
