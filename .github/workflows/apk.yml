name: APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Tests del intérprete
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm --filter mobile lint

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Generar proyecto Android
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - name: Compilar APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: rinfo-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk

      - name: Publicar en el release "ultima"
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk rinfo.apk
          gh release delete ultima --yes --cleanup-tag || true
          gh release create ultima rinfo.apk \
            --title "Última versión" \
            --notes "APK generado desde ${GITHUB_SHA::7}. Descargalo desde el celular e instalalo." \
            --prerelease
